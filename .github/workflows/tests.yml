name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Parser and earthworks tests (GDAL, no QGIS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NumPy and GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-numpy python3-gdal
      - name: Every module compiles
        # Catches syntax errors (e.g. from a bad merge) in modules the QGIS-free tests never import.
        run: python3 -m compileall -q -x '(^|/)(dist|\.git)/' .
      - name: No merge-conflict markers
        run: "! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)( |$)' -- '*.py' '*.md' '*.html' '*.json' '*.txt' '*.yml'"
      - name: Run tests
        run: python3 -m unittest -v tests/test_landxml.py tests/test_earthworks.py tests/test_criteria_tables.py tests/test_grading.py

  qgis-tests:
    name: QGIS runtime tests (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [3.44.15-trixie, 4.2.3-trixie]
    container: qgis/qgis:${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
      QGIS_PREFIX_PATH: /usr
      PYTHONPATH: /usr/share/qgis/python:/usr/share/qgis/python/plugins
    steps:
      - name: Install Git for checkout and packaging tests
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - name: Report QGIS version
        run: python3 -c "from qgis.core import Qgis; print(Qgis.QGIS_VERSION)"
      - name: Run all tests with QGIS
        run: python3 -m unittest discover -s tests -t . -v

  bandit:
    name: Bandit security scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -q -r . -x ./tests,./dist
